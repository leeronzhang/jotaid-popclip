# PopClip extension for Jotaid.
#
# Selecting text anywhere on macOS and clicking "Jotaid" in the PopClip bar
# sends the selection to the Jotaid Inbox, together with where it came from.
#
# Install: double-click the enclosing `Jotaid.popclipext` folder.
# See README.md for details.

name: Jotaid
# Fixed for good once published to the directory — renaming it there means
# retiring this extension and shipping a different one.
identifier: com.jotaid.popclip
description: Save the selection to your Jotaid Inbox, with its source and time.
# The Jotaid mark, monochrome — see jotaid.svg for what differs from the app's
# own gradient logo and why.
icon: jotaid.svg
# The features used here (capture html, after: show-status, boolean options,
# POPCLIP_APP_IDENTIFIER) are all long-standing, so the bar is kept low even
# though development happens against a current build.
popclip version: 4151
macos version: "14.0"

# The extension does nothing without the app: every clipping is handed to
# Jotaid over its `jotaid://` URL scheme. Declaring this keeps the action out
# of the PopClip bar on machines that do not have it, instead of failing
# silently after the click.
app:
  name: Jotaid
  link: https://jotaid.com
  check installed: true
  bundle identifiers:
    - np.Jotaid

options:
  - identifier: keepformatting
    type: boolean
    label: Keep formatting
    default value: true
    description: >-
      Send the selection as Markdown when the source app offers rich text, so
      links and emphasis survive the trip. Turn off to always send plain text.

  - identifier: includesource
    type: boolean
    label: Include source
    default value: true
    description: >-
      Add the page title, page link and app name to the footnote of the saved
      note. Turn off to save the selection alone.

  - identifier: editbeforesaving
    type: boolean
    label: Edit before saving
    default value: false
    description: >-
      Open a small window in Jotaid so you can edit the clipping before it is
      saved. Off (the default) saves it straight to the Inbox without
      interrupting you. The window has a "Don't ask again" box; ticking it
      switches back to silent saving, and turning this option off and on again
      brings the window back.

actions:
  - title: Jotaid
    shell script file: clip.zsh
    interpreter: /bin/zsh
    # Needed for POPCLIP_MARKDOWN; harmless when "Keep formatting" is off.
    capture html: true
    requirements: [text]
    # Shows a tick (or a cross) right in the PopClip bar — the app itself saves
    # silently in the background, so this is the only immediate feedback.
    after: show-status
